<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gatewise-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA472" />
      <stop offset="40%" stop-color="#23865D" />
      <stop offset="100%" stop-color="#114D35" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FAF4" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#08291C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#gatewise-grad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6" />

  <!-- Security Shield Silhouette with Soft Shadow -->
  <path d="M 256 95 L 385 142 C 385 272 322 355 256 418 C 190 355 127 272 127 142 Z"
        fill="url(#shield-grad)"
        filter="url(#drop-shadow)" />

  <!-- Verification Checkmark in Rich Deep Emerald -->
  <path d="M 200 252 L 242 296 L 318 206"
        fill="none"
        stroke="#176346"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>